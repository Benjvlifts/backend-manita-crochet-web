server.port=8080
spring.application.name=lanas-service

# --- Microsoft Entra External ID (CIAM) ---
# AZURE_TENANT_SUBDOMAIN: el nombre del tenant tal cual aparece en https://<subdominio>.ciamlogin.com
# (NO es lo mismo que el Tenant ID/GUID). Ambos servicios (lanas-service y pedidos-service) comparten
# el mismo tenant y el mismo App Registration.
azure.tenant-id=${AZURE_TENANT_ID:YOUR_AZURE_TENANT_ID}
azure.tenant-subdomain=${AZURE_TENANT_SUBDOMAIN:YOUR_TENANT_SUBDOMAIN}
azure.client-id=${AZURE_CLIENT_ID:YOUR_AZURE_CLIENT_ID}

# --- Base de datos: H2 (dev) ---
spring.datasource.url=${DB_URL:jdbc:h2:mem:manitadb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- MySQL (prod / RDS): descomentar y setear variables de entorno ---
# DB_URL=jdbc:mysql://YOUR_RDS_ENDPOINT:3306/manitadb
# DB_USER=admin
# DB_PASSWORD=YOUR_DB_PASSWORD
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
