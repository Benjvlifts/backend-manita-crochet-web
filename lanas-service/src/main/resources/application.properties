server.port=8080
spring.application.name=lanas-service

# --- Azure AD / Entra ID (tenant normal, login.microsoftonline.com) ---
azure.tenant-id=${AZURE_TENANT_ID:YOUR_AZURE_TENANT_ID}
azure.client-id=${AZURE_CLIENT_ID:YOUR_AZURE_CLIENT_ID}

# --- CORS: orígenes permitidos para el frontend Angular (separados por coma) ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Base de datos: H2 (dev) ---
spring.datasource.url=${DB_URL:jdbc:h2:mem:manitadb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- MySQL (prod / RDS): descomentar y setear variables de entorno ---
# DB_URL=jdbc:mysql://YOUR_RDS_ENDPOINT:3306/manitadb
# DB_USER=admin
# DB_PASSWORD=YOUR_DB_PASSWORD
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =====================================================================================
# EP5 — Apache Kafka (streaming de eventos y analítica)
# =====================================================================================

# --- Cliente: brokers del docker-compose (docker/kafka) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

# --- Productor: String para la key, JSON para el valor (DTO). acks=all + idempotencia = sin pérdidas ni duplicados ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000
# Si Kafka está caído, send() no debe congelar la petición HTTP: se rinde a los 3 s.
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.spring.json.add.type.headers=false

# --- Consumidor: deserializadores envueltos en ErrorHandlingDeserializer (un mensaje corrupto no bloquea la partición) ---
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.manitacrochet.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.max.poll.records=50
spring.kafka.consumer.properties.session.timeout.ms=15000
# El offset se confirma por registro, solo después de procesarlo.
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false

# --- Tópicos (nombres y administración). Este servicio es dueño de lanas.eventos ---
kafka.topic.lanas.name=lanas.eventos
kafka.topic.lanas.partitions=2
kafka.topic.lanas.replicas=${KAFKA_LANAS_REPLICATION_FACTOR:2}
kafka.topic.lanas.min-insync-replicas=1
# compact: Kafka conserva solo el último evento de cada lana (es estado, no historial)
kafka.topic.lanas.cleanup-policy=compact
kafka.topic.lanas.delete-retention-ms=86400000
# Tópico del que solo se consume (su dueño es pedidos-service)
kafka.topic.pedidos.name=pedidos.eventos

# --- Consumer group de analítica: las 3 particiones de pedidos.eventos se reparten entre 3 hilos ---
kafka.consumer.group.ventas=lanas-analitica
kafka.consumer.concurrency.ventas=3

# --- Errores: reintentos con espera fija; si se agotan, el mensaje se registra en el log y se descarta ---
kafka.consumer.retry.attempts=3
kafka.consumer.retry.backoff-ms=1000

# --- Solo demostración: pedidos de clientes cuyo nombre empiece con este prefijo simulan una falla temporal
#     en la analítica (se reintenta y luego se descarta). Dejar vacío para desactivar. ---
kafka.demo.failure-prefix=FALLA-
