server.port=8082
spring.application.name=rabbitmq-admin-service

# --- Microsoft Entra ID (tenant normal, login.microsoftonline.com) ---
# Mismo tenant y mismo App Registration que lanas-service y pedidos-service.
azure.tenant-id=${AZURE_TENANT_ID:YOUR_AZURE_TENANT_ID}
azure.client-id=${AZURE_CLIENT_ID:YOUR_AZURE_CLIENT_ID}

# --- CORS: orígenes permitidos para el frontend Angular (separados por coma) ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Conexión a RabbitMQ (mismo broker que usa pedidos-service) ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
