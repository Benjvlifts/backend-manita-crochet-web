server.port=8083
spring.application.name=kafka-admin-service

# --- Microsoft Entra ID (tenant normal, login.microsoftonline.com) ---
# Mismo tenant y mismo App Registration que el resto de los microservicios.
azure.tenant-id=${AZURE_TENANT_ID:YOUR_AZURE_TENANT_ID}
azure.client-id=${AZURE_CLIENT_ID:YOUR_AZURE_CLIENT_ID}

# --- CORS: orígenes permitidos para el frontend Angular (separados por coma) ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Conexión a Kafka (brokers del docker-compose en docker/kafka) ---
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
# Si el broker no responde, falla rápido con 503 en vez de colgar la petición.
kafka.admin.request-timeout-ms=5000
kafka.admin.timeout-ms=8000
