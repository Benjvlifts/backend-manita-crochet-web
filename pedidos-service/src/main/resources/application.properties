server.port=8081
spring.application.name=pedidos-service

# --- Microsoft Entra ID (tenant normal, login.microsoftonline.com) ---
# Mismos 2 valores que usa lanas-service: son el MISMO tenant y el MISMO App Registration
# (un solo registro de aplicación, con su scope expuesto, sirve para todo el sistema).
azure.tenant-id=${AZURE_TENANT_ID:YOUR_AZURE_TENANT_ID}
azure.client-id=${AZURE_CLIENT_ID:YOUR_AZURE_CLIENT_ID}

# --- CORS: orígenes permitidos para el frontend Angular (separados por coma) ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Base de datos: H2 (dev) ---
spring.datasource.url=${DB_URL:jdbc:h2:mem:pedidosdb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- MySQL (prod / RDS): descomentar y setear variables de entorno ---
# DB_URL=jdbc:mysql://YOUR_RDS_ENDPOINT:3306/pedidosdb
# DB_USER=admin
# DB_PASSWORD=YOUR_DB_PASSWORD
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =====================================================================================
# EP3 — RabbitMQ (mensajería asíncrona)
# Pauta: "Define en application.yml o clase @Configuration los nombres de colas, exchanges y
# bindings de forma centralizada". TODOS los nombres viven aquí; el código solo usa ${...}.
# =====================================================================================

# --- Conexión al broker ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- Consumidores: ACK MANUAL (cada consumidor confirma/rechaza explícitamente) ---
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Un rechazo (nack) nunca vuelve a la cola: va al Dead Letter Exchange -> DLQ.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10

# --- Exchanges ---
rabbitmq.exchange.pedidos=pedidos.exchange
rabbitmq.exchange.dlx=pedidos.dlx

# --- Colas (casos de uso: notificaciones y tickets) + sus Dead Letter Queues ---
rabbitmq.queue.pedidos=pedidos.queue
rabbitmq.queue.pedidos-dlq=pedidos.dlq
rabbitmq.queue.tickets=pedidos.ticket.queue
rabbitmq.queue.tickets-dlq=pedidos.ticket.dlq

# --- Routing keys / bindings ---
rabbitmq.routing-key.pedidos=pedidos.routing.key
rabbitmq.routing-key.pedidos-dlq=pedidos.dlq.routing.key
rabbitmq.routing-key.tickets=pedidos.ticket.routing.key
rabbitmq.routing-key.tickets-dlq=pedidos.ticket.dlq.routing.key

# --- Política de reintentos para errores recuperables (antes de enviar a la DLQ) ---
rabbitmq.retry.max-attempts=3
rabbitmq.retry.backoff-ms=1000

# --- DLQ: consumidor opcional que solo registra en logs. Apagado por defecto para que los
#     mensajes muertos queden visibles en la consola de RabbitMQ (http://localhost:15672). ---
rabbitmq.dlq.consumer.enabled=false

# --- Solo para demostración: clientes cuyo nombre empiece con este prefijo simulan una falla
#     temporal (error recuperable) y terminan en la DLQ tras agotar los reintentos.
#     Dejar vacío para desactivar. ---
rabbitmq.demo.failure-prefix=FALLA-
