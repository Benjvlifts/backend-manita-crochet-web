server.port=8081
spring.application.name=pedidos-service

# --- Microsoft Entra External ID (CIAM) ---
# AZURE_TENANT_SUBDOMAIN: el nombre del tenant tal cual aparece en https://<subdominio>.ciamlogin.com
# (NO es lo mismo que el Tenant ID/GUID). Mismos 3 valores que usa lanas-service: son el MISMO tenant
# y el MISMO App Registration (un solo registro sirve para todo el sistema).
azure.tenant-id=${AZURE_TENANT_ID:YOUR_AZURE_TENANT_ID}
azure.tenant-subdomain=${AZURE_TENANT_SUBDOMAIN:YOUR_TENANT_SUBDOMAIN}
azure.client-id=${AZURE_CLIENT_ID:YOUR_AZURE_CLIENT_ID}

# --- Base de datos: H2 (dev) ---
spring.datasource.url=${DB_URL:jdbc:h2:mem:pedidosdb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- MySQL (prod / RDS): descomentar y setear variables de entorno ---
# DB_URL=jdbc:mysql://YOUR_RDS_ENDPOINT:3306/pedidosdb
