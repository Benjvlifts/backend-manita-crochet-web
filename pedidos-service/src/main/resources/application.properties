server.port=8081
spring.application.name=pedidos-service

# --- Microsoft Entra ID (tenant normal, login.microsoftonline.com) ---
# Mismos 2 valores que usa lanas-service: son el MISMO tenant y el MISMO App Registration
# (un solo registro de aplicación, con su scope expuesto, sirve para todo el sistema).
azure.tenant-id=${AZURE_TENANT_ID:YOUR_AZURE_TENANT_ID}
azure.client-id=${AZURE_CLIENT_ID:YOUR_AZURE_CLIENT_ID}

# --- CORS: orígenes permitidos para el frontend Angular (separados por coma) ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Base de datos: H2 (dev) ---
spring.datasource.url=${DB_URL:jdbc:h2:mem:pedidosdb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- MySQL (prod / RDS): descomentar y setear variables de entorno ---
# DB_URL=jdbc:mysql://YOUR_RDS_ENDPOINT:3306/pedidosdb
# DB_USER=admin
# DB_PASSWORD=YOUR_DB_PASSWORD
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =====================================================================================
# EP3 — RabbitMQ (mensajería asíncrona)
# Pauta: "Define en application.yml o clase @Configuration los nombres de colas, exchanges y
# bindings de forma centralizada". TODOS los nombres viven aquí; el código solo usa ${...}.
# =====================================================================================

# --- Conexión al broker ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- Consumidores: ACK MANUAL (cada consumidor confirma/rechaza explícitamente) ---
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Un rechazo (nack) nunca vuelve a la cola: va al Dead Letter Exchange -> DLQ.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10

# --- Exchanges ---
rabbitmq.exchange.pedidos=pedidos.exchange
rabbitmq.exchange.dlx=pedidos.dlx

# --- Colas (casos de uso: notificaciones y tickets) + sus Dead Letter Queues ---
rabbitmq.queue.pedidos=pedidos.queue
rabbitmq.queue.pedidos-dlq=pedidos.dlq
rabbitmq.queue.tickets=pedidos.ticket.queue
rabbitmq.queue.tickets-dlq=pedidos.ticket.dlq

# --- Routing keys / bindings ---
rabbitmq.routing-key.pedidos=pedidos.routing.key
rabbitmq.routing-key.pedidos-dlq=pedidos.dlq.routing.key
rabbitmq.routing-key.tickets=pedidos.ticket.routing.key
rabbitmq.routing-key.tickets-dlq=pedidos.ticket.dlq.routing.key

# --- Política de reintentos para errores recuperables (antes de enviar a la DLQ) ---
rabbitmq.retry.max-attempts=3
rabbitmq.retry.backoff-ms=1000

# --- DLQ: consumidor opcional que solo registra en logs. Apagado por defecto para que los
#     mensajes muertos queden visibles en la consola de RabbitMQ (http://localhost:15672). ---
rabbitmq.dlq.consumer.enabled=false

# --- Solo para demostración: clientes cuyo nombre empiece con este prefijo simulan una falla
#     temporal (error recuperable) y terminan en la DLQ tras agotar los reintentos.
#     Dejar vacío para desactivar. ---
rabbitmq.demo.failure-prefix=FALLA-
# RabbitMQ: soporta un clúster (varias direcciones separadas por coma). Por defecto usa host/port de arriba.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}

# =====================================================================================
# EP5 — Apache Kafka (streaming de eventos). Convive con RabbitMQ sin tocarlo:
# RabbitMQ = tareas/comandos (notificar, generar ticket); Kafka = historial de eventos y analítica.
# =====================================================================================

# --- Cliente: brokers del docker-compose (docker/kafka) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

# --- Productor: String para la key, JSON para el valor (DTO). acks=all + idempotencia = sin pérdidas ni duplicados ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000
# Si Kafka está caído, send() no debe congelar la petición HTTP: se rinde a los 3 s.
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.spring.json.add.type.headers=false

# --- Consumidor: deserializadores envueltos en ErrorHandlingDeserializer (un mensaje corrupto no bloquea la partición) ---
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.manitacrochet.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.max.poll.records=50
spring.kafka.consumer.properties.session.timeout.ms=15000
# El offset se confirma por registro, solo después de procesarlo.
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false

# --- Tópicos (nombres y administración). Este servicio es dueño de pedidos.eventos ---
kafka.topic.pedidos.name=pedidos.eventos
kafka.topic.pedidos.partitions=3
kafka.topic.pedidos.replicas=${KAFKA_REPLICATION_FACTOR:3}
kafka.topic.pedidos.min-insync-replicas=${KAFKA_MIN_ISR:2}
kafka.topic.pedidos.retention-ms=604800000
kafka.topic.pedidos.cleanup-policy=delete
# Tópico del que solo se consume (su dueño es lanas-service)
kafka.topic.lanas.name=lanas.eventos

# --- Consumer groups: un grupo por responsabilidad; la concurrencia reparte las particiones entre hilos ---
kafka.consumer.group.catalogo=pedidos-catalogo
kafka.consumer.group.auditoria=pedidos-auditoria
kafka.consumer.concurrency.catalogo=2
kafka.consumer.concurrency.auditoria=3

# --- Errores: reintentos con espera fija; si se agotan, el mensaje se registra en el log y se descarta ---
kafka.consumer.retry.attempts=3
kafka.consumer.retry.backoff-ms=1000
