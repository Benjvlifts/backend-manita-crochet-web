# Clúster de RabbitMQ de 2 nodos (EP4/EP5).
#   docker compose up -d
#   docker exec pedidos360-rabbitmq1 rabbitmqctl cluster_status
# Consolas: nodo 1 -> http://localhost:15672   nodo 2 -> http://localhost:15673   (guest / guest)
#
# Alta disponibilidad de las colas (ejecutar UNA vez, con el clúster arriba): replica en ambos nodos
# todas las colas que empiezan con "pedidos.":
#   docker exec pedidos360-rabbitmq1 rabbitmqctl set_policy ha-pedidos "^pedidos\." \
#     '{"ha-mode":"all","ha-sync-mode":"automatic"}' --apply-to queues
name: pedidos360-rabbitmq

x-rabbit: &rabbit
  image: rabbitmq:3.13-management
  restart: unless-stopped
  environment:
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-cookie}   # debe ser igual en todos los nodos
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
  volumes:
    - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
  networks:
    - rabbit-net

services:
  rabbitmq1:
    <<: *rabbit
    container_name: pedidos360-rabbitmq1
    hostname: rabbitmq1
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # consola web
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - rabbitmq1-data:/var/lib/rabbitmq

  rabbitmq2:
    <<: *rabbit
    container_name: pedidos360-rabbitmq2
    hostname: rabbitmq2
    depends_on:
      - rabbitmq1
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - rabbitmq2-data:/var/lib/rabbitmq

volumes:
  rabbitmq1-data:
  rabbitmq2-data:

networks:
  rabbit-net:
