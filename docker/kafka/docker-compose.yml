# Arquitectura Kafka (EP5): 1 Zookeeper + 3 brokers.
#   docker compose up -d
#   docker exec pedidos360-kafka1 kafka-topics --bootstrap-server kafka1:29092 --list
#
# Dos listeners por broker:
#   INTERNAL (kafka1:29092 ...)  -> comunicación entre brokers y con Kafka-UI (dentro de la red Docker)
#   EXTERNAL (localhost:9092 ...) -> los microservicios Spring Boot
# En AWS (EC2) define KAFKA_EXTERNAL_HOST con la IP/DNS desde la que se conectan los microservicios:
#   KAFKA_EXTERNAL_HOST=10.0.1.25 docker compose up -d
name: pedidos360-kafka

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.5.3
  restart: unless-stopped
  depends_on:
    - zookeeper
  networks:
    - kafka-net

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
  # Los tópicos los crean los microservicios y kafka-admin-service, no se crean solos.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: pedidos360-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kafka-net

  kafka1:
    <<: *kafka
    container_name: pedidos360-kafka1
    hostname: kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092

  kafka2:
    <<: *kafka
    container_name: pedidos360-kafka2
    hostname: kafka2
    ports:
      - "9093:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9093

  kafka3:
    <<: *kafka
    container_name: pedidos360-kafka3
    hostname: kafka3
    ports:
      - "9094:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094

networks:
  kafka-net:
    name: pedidos360-kafka-net   # nombre fijo: Kafka-UI se conecta a esta misma red
